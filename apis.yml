aid: cigna
name: Cigna
description: Cigna Healthcare is a leading global health services company offering
  medical, dental, behavioral, and pharmacy plans for individuals, families, and employers.
  The Cigna Developer Portal exposes CMS-mandated FHIR APIs for Patient Access, Provider
  Directory, Drug Formulary, and Provider Access, along with member and provider service
  APIs that enable third-party applications, electronic health record systems, and
  partners to access member health data with consent and look up Cigna network providers
  and formulary information.
