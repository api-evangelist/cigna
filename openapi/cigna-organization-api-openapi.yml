openapi: 3.2.0
info:
  title: Cigna Provider Directory Organization API
  description: Public FHIR-based Provider Directory API listing Cigna's contracted practitioners, organizations, locations, healthcare services, networks, and insurance plans. Implements the HL7 Da Vinci PDex Plan Network IG and the CMS Provider Directory API requirements.
  version: '1.0'
  contact:
    name: Cigna Developer Support
    url: https://developer.cigna.com/support
servers:
- url: https://fhir.cigna.com/ProviderDirectory/v1
  description: Cigna Provider Directory Production
tags:
- name: Organization
paths:
  /Organization:
    get:
      operationId: searchOrganization
      summary: Search organizations in the Cigna network
      tags:
      - Organization
      responses:
        '200':
          description: FHIR Bundle of Organization resources
externalDocs:
  description: Provider Directory Implementation Guide
  url: https://developer.cigna.com/docs/service-apis/provider-directory/implementation-guide
